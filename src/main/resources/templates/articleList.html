<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>블로그 글 목록</title>
  <!-- bootstrap: 화면을 쉽고 간편하게 만들 수 있도록 지원한다. -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
<div class="p-5 mb-5 text-center</> bg-light">
  <h1 class="mb-3">My Blog</h1>
  <h4 class="mb-3">블로그에 오신 것을 환영합니다.</h4>
</div>

<div class="container">
  <button type="button" id="create-btn"
          th:onclick="|location.href='@{/new-article}'|"
          class="btn btn-secondary btn-sm mb-3">글 등록</button>
  <!-- th:each: articles 키에 담긴 데이터 개수만큼 반복한다. -->
  <div class="row-6" th:each="item : ${articles}">
    <div class ="card">
      <!-- th:text: th:each의 반복 대상 객체의 id, "text"를 출력한다. -->
      <div class="card-header" th:text="${item.id}">
      </div>
      <!-- 이미지를 표시하도록 코드 추가 -->
      <img th:if="${item.imageUrl != null and item.imageUrl != ''}"
           th:src="${item.imageUrl}"
           class="card-img-top"
           alt="게시글 이미지"
           style="max-height: 300px; object-fit: cover;">
      <div class="card-body">
        <h5 class="card-title" th:text="${item.title}"></h5>
        <p class="card-text" th:text="${item.content}"></p>
        <!-- 글 상세를 보러가기 위해 하단을 조금 수정 -->
        <a th:href="@{/articles/{id}(id=${item.id})}" class="btn btn-primary">보러 가기</a>
      </div>
    </div>
    <br>
  </div>
  <button type="button" id="logout-btn" class="btn btn-secondary">로그아웃</button>
</div>

<!-- 토큰을 가져올 수 있도록 파일 추가. -->
<script src="/js/token.js"></script>
<!-- article.js 파일 추가 -->
<script src="/js/article.js"></script>
</body>
</html>
