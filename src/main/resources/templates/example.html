<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<h1>타임리프 익히기</h1>
<!-- #temporals.format(): LocalDate를 yyyy-MM-dd 포맷으로 변경 -->
<p th:text="${#temporals.format(today, 'yyyy-MM-dd')}"></p>
<!-- th:object: 모델에서 받은 객체 중 "person" 이라는 키를 가진 객체의 데이터를 하위 태그에 지정 -->
<div th:object="${person}">
  <!-- "person"의 데이터를 하위 태그로 지정하였기에 *{name}, *{age} 등으로 접근 가능. -->
  <!-- th:text: 텍스트로 표현 -->
  <p th:text="|이름 : *{name}|"></p>
  <p th:text="|나이 : *{age}|"></p>
  <p>취미</p>
  <!-- th:each: hobbies 개수만큼 반복하는 반복자 -->
  <ul th:each="hobby: *{hobbies}">
    <li th:text="${hobby}"></li>
    <!-- th:if(조건문): 반복 대상이 운동이라면 '대표 취미'라는 표지 추가 -->
    <span th:if="${hobby == '운동'}">(대표 취미)</span>
  </ul>
</div>
<!-- 1번 블로그 글을 보러 이동 -->
<a th:href="@{/api/articles/{id}(id=${person.id})}">글 보기</a>
</body>
</html>
