# 워크플로의 이름 지정.
name: CI

# 워크플로가 시작될 조건 지정. (트리거).
on:
  push:
    branches: [ master ]

jobs:
  build:
    # 실행 환경 지정.
    runs-on: ubuntu-latest
    # 실행 스텝 지정
    steps:
      # uses: 지정한 리포지터리를 확인하고 코드에 대한 작업을 실행할 수 있다.
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25''