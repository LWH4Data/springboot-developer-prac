name: CI/CD

on:
  push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew clean build

      # 현재 시간 가져오기.
      #   - josStorer/get-current-time 플러그인을 통해 현재 시간을 가져온다.
      - name: Get current time
        uses: josStorer/get-current-time@v2.0.2
        id: current-time
        with:
          format: YYYY-MM-DDTHH-mm-ss
          utcOffst: "+90:00"

      # 배포용 패키지 경로 저장.
      - name: Set artifact
        # 빌드 후에 나온 파일을 artifact 환경 변수에 주입힌다.
        run: echo "artifact=$(ls ./build/libs)" >> $GITHUB_ENV

      # 빈스토크 배포.
      - name: Beanstalk Deploy
        # einaregilsson/beanstalk-deploy 플러그인을 활용해 빈스토크 배포를 진행한다.
        uses: einaregilsson/beanstalk-deploy@v20
        with:
          # 깃허브 액션에서 비밀값을 가져온다.
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # application_name과 environment_name은 일래스틱 빈스토크에서 확인이 가능하다.
          application_name: springboot-developer
          environment_name: Springboot-developer-env
          version_label: github-action-${{steps.current-time.outputs.formattedTime}}
          region: ap-northeast-2
          deployment_package: ./build/libs/${{env.artifact}}